<!DOCTYPE html>
<!--
  Variant page: 50,000 words by default, but the count can be overridden
  via `?n=NUMBER`. Each word is wrapped in a <span class="word"> element.
  Compared against `plain.html` (or against itself with two different
  `?n=` values) this should show the per-element DOM/memory overhead of
  wrapping every word.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Words wrapped in spans</title>
  </head>
  <body>
    <div id="content"></div>
    <script>
      const t0 = performance.now();
      const params = new URL(document.location).searchParams;
      const N = Number(params.get('n')) || 50000;
      const container = document.getElementById('content');
      for (let i = 0; i < N; i++) {
        const span = document.createElement('span');
        span.className = 'word';
        span.textContent = 'word' + i;
        container.appendChild(span);
        if (i < N - 1) {
          container.appendChild(document.createTextNode(' '));
        }
      }
      const buildTime = performance.now() - t0;
      // Defer signalling completion until after the first paint commit so
      // that any memory measurements running on top of this page capture
      // post-paint state (LayoutObjects, DisplayItems, raster, etc.)
      // rather than the in-between state where the DOM exists but nothing
      // has been laid out or painted yet. A single requestAnimationFrame
      // fires *before* the next paint; the nested one therefore fires
      // *after* that paint has committed.
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          window.tachometerResult = buildTime;
        });
      });
    </script>
  </body>
</html>
