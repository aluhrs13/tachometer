<!DOCTYPE html>
<!--
  Variant page: the same 50,000 words, but each one wrapped in a
  <span class="word"> element. Compared against `plain.html` this should
  show the per-element DOM/memory overhead of wrapping every word.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>50,000 words (wrapped in spans)</title>
  </head>
  <body>
    <div id="content"></div>
    <script>
      const N = 50000;
      const container = document.getElementById('content');
      for (let i = 0; i < N; i++) {
        const span = document.createElement('span');
        span.className = 'word';
        span.textContent = 'word' + i;
        container.appendChild(span);
        if (i < N - 1) {
          container.appendChild(document.createTextNode(' '));
        }
      }
      // Signal completion to tachometer's `expression` measurement mode.
      window.tachometerResult = performance.now();
    </script>
  </body>
</html>
