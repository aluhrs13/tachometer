<!DOCTYPE html>
<!--
  1 base CSS custom property and 50 calc() expressions to derive the
  equivalent spacing values from it. Each `.item-N` rule reuses the same
  `--space` token, multiplying by a different small integer to produce
  the same visual layout as `tokens.html`. Compared against `tokens.html`
  to measure whether calc()-based derivation is observably more
  expensive than declaring tokens directly.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CSS spacing: 1 token + calc()</title>
    <style>
      :root {
        --space: 2px;
      }
      .item {
        display: block;
        background: #eef;
        border: 1px solid #aac;
        font: 12px/1.4 system-ui, sans-serif;
      }
      .item-1 {
        padding: calc(var(--space) * 1) calc(var(--space) * 2)
          calc(var(--space) * 3) calc(var(--space) * 4);
        margin-bottom: calc(var(--space) * 5);
      }
      .item-2 {
        padding: calc(var(--space) * 2) calc(var(--space) * 3)
          calc(var(--space) * 4) calc(var(--space) * 5);
        margin-bottom: calc(var(--space) * 6);
      }
      .item-3 {
        padding: calc(var(--space) * 3) calc(var(--space) * 4)
          calc(var(--space) * 5) calc(var(--space) * 6);
        margin-bottom: calc(var(--space) * 7);
      }
      .item-4 {
        padding: calc(var(--space) * 4) calc(var(--space) * 5)
          calc(var(--space) * 6) calc(var(--space) * 7);
        margin-bottom: calc(var(--space) * 8);
      }
      .item-5 {
        padding: calc(var(--space) * 5) calc(var(--space) * 6)
          calc(var(--space) * 7) calc(var(--space) * 8);
        margin-bottom: calc(var(--space) * 9);
      }
      .item-6 {
        padding: calc(var(--space) * 6) calc(var(--space) * 7)
          calc(var(--space) * 8) calc(var(--space) * 9);
        margin-bottom: calc(var(--space) * 10);
      }
      .item-7 {
        padding: calc(var(--space) * 7) calc(var(--space) * 8)
          calc(var(--space) * 9) calc(var(--space) * 10);
        margin-bottom: calc(var(--space) * 1);
      }
      .item-8 {
        padding: calc(var(--space) * 8) calc(var(--space) * 9)
          calc(var(--space) * 10) calc(var(--space) * 1);
        margin-bottom: calc(var(--space) * 2);
      }
      .item-9 {
        padding: calc(var(--space) * 9) calc(var(--space) * 10)
          calc(var(--space) * 1) calc(var(--space) * 2);
        margin-bottom: calc(var(--space) * 3);
      }
      .item-10 {
        padding: calc(var(--space) * 10) calc(var(--space) * 1)
          calc(var(--space) * 2) calc(var(--space) * 3);
        margin-bottom: calc(var(--space) * 4);
      }
    </style>
  </head>
  <body>
    <div id="content"></div>
    <script>
      const t0 = performance.now();
      const N = 5000;
      const container = document.getElementById('content');
      for (let i = 0; i < N; i++) {
        const div = document.createElement('div');
        div.className = 'item item-' + ((i % 10) + 1);
        div.textContent = 'item ' + i;
        container.appendChild(div);
      }
      const buildTime = performance.now() - t0;
      // Measure the *total* time from script start to "first frame
      // committed", which includes style resolution (where calc() is
      // evaluated) and layout. The DOM-construction-only number is
      // recorded too in case it's useful, but the total is what
      // actually exercises calc().
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          const totalTime = performance.now() - t0;
          window.tachometerBuildTime = buildTime;
          window.tachometerResult = totalTime;
        });
      });
    </script>
  </body>
</html>
