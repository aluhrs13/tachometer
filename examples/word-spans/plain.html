<!DOCTYPE html>
<!--
  Baseline page: 50,000 words rendered as a single text node.

  Used to compare DOM/memory cost against `wrapped.html`, which wraps each
  word in a <span class="word"> element.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>50,000 words (plain text)</title>
  </head>
  <body>
    <div id="content"></div>
    <script>
      const t0 = performance.now();
      const N = 50000;
      const words = new Array(N);
      for (let i = 0; i < N; i++) {
        words[i] = 'word' + i;
      }
      document.getElementById('content').textContent = words.join(' ');
      const buildTime = performance.now() - t0;
      // Defer signalling completion until after the first paint commit so
      // that any memory measurements running on top of this page capture
      // post-paint state (LayoutObjects, DisplayItems, raster, etc.)
      // rather than the in-between state where the DOM exists but nothing
      // has been laid out or painted yet. A single requestAnimationFrame
      // fires *before* the next paint; the nested one therefore fires
      // *after* that paint has committed.
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          window.tachometerResult = buildTime;
        });
      });
    </script>
  </body>
</html>
