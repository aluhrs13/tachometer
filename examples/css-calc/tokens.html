<!DOCTYPE html>
<!--
  10 distinct CSS custom properties for spacing. Each `.item-N` rule
  references named tokens directly without any calc() arithmetic.
  Compared against `calc.html` to measure whether deriving spacing values
  via calc(var(--space) * N) is observably more expensive than declaring
  them as flat tokens.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CSS spacing: 10 tokens</title>
    <style>
      :root {
        --space-1: 2px;
        --space-2: 4px;
        --space-3: 6px;
        --space-4: 8px;
        --space-5: 10px;
        --space-6: 12px;
        --space-7: 14px;
        --space-8: 16px;
        --space-9: 18px;
        --space-10: 20px;
      }
      .item {
        display: block;
        background: #eef;
        border: 1px solid #aac;
        font: 12px/1.4 system-ui, sans-serif;
      }
      .item-1 {
        padding: var(--space-1) var(--space-2) var(--space-3) var(--space-4);
        margin-bottom: var(--space-5);
      }
      .item-2 {
        padding: var(--space-2) var(--space-3) var(--space-4) var(--space-5);
        margin-bottom: var(--space-6);
      }
      .item-3 {
        padding: var(--space-3) var(--space-4) var(--space-5) var(--space-6);
        margin-bottom: var(--space-7);
      }
      .item-4 {
        padding: var(--space-4) var(--space-5) var(--space-6) var(--space-7);
        margin-bottom: var(--space-8);
      }
      .item-5 {
        padding: var(--space-5) var(--space-6) var(--space-7) var(--space-8);
        margin-bottom: var(--space-9);
      }
      .item-6 {
        padding: var(--space-6) var(--space-7) var(--space-8) var(--space-9);
        margin-bottom: var(--space-10);
      }
      .item-7 {
        padding: var(--space-7) var(--space-8) var(--space-9) var(--space-10);
        margin-bottom: var(--space-1);
      }
      .item-8 {
        padding: var(--space-8) var(--space-9) var(--space-10) var(--space-1);
        margin-bottom: var(--space-2);
      }
      .item-9 {
        padding: var(--space-9) var(--space-10) var(--space-1) var(--space-2);
        margin-bottom: var(--space-3);
      }
      .item-10 {
        padding: var(--space-10) var(--space-1) var(--space-2) var(--space-3);
        margin-bottom: var(--space-4);
      }
    </style>
  </head>
  <body>
    <div id="content"></div>
    <script>
      const t0 = performance.now();
      const N = 5000;
      const container = document.getElementById('content');
      for (let i = 0; i < N; i++) {
        const div = document.createElement('div');
        div.className = 'item item-' + ((i % 10) + 1);
        div.textContent = 'item ' + i;
        container.appendChild(div);
      }
      // Measure the *total* time from script start to "first frame
      // committed", which includes style resolution (where calc() is
      // evaluated) and layout. The DOM-construction-only number is
      // recorded too in case it's useful, but the total is what
      // actually exercises calc().
      const buildTime = performance.now() - t0;
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          const totalTime = performance.now() - t0;
          window.tachometerBuildTime = buildTime;
          window.tachometerResult = totalTime;
        });
      });
    </script>
  </body>
</html>
